  function renderBlocksHtml(blocks, refs, mediaMap, opts = {}) {
    const { editable = true, allHeadings = [] } = opts;
    return blocks
      .map((blk, idx) => {
        const cCls = colorClass(blk.color);
        if (editable && state.editingBlockIdx === idx) {
          const isMono = blk.type === 'code';
          return `
            <div class="block-editor-box" data-editing-idx="${idx}">
              <textarea class="block-editor-textarea ${isMono ? 'is-mono' : ''}" id="activeBlockEditor">${escapeHtml(blk.raw)}</textarea>
              <div class="block-editor-foot">
                <span>Ctrl + Enter 保存到 Notion · Esc 取消</span>
                <div class="block-editor-btns">
                  <button type="button" class="mini-chip-btn" id="btnCancelBlockEdit">取消</button>
                  <button type="button" class="solid-btn" id="btnSaveBlockEdit" style="height:26px;font-size:12px;padding:0 12px;">保存</button>
                </div>
              </div>
            </div>
          `;
        }

        const editBtnHtml = editable
          ? `<div class="block-actions"><button type="button" class="mini-chip-btn" data-edit-block="${idx}">编辑</button></div>`
          : '';
        const dblAttr = editable ? `data-dblclick-edit="${idx}"` : '';

        if (blk.type === 'code') {
          return `
            <div class="block-item" data-block-idx="${idx}">
              <div class="blk-code-wrap">
                ${blk.lang ? `<span class="blk-code-lang">${escapeHtml(blk.lang)}</span>` : ''}
                <div class="block-actions">
                  ${editable ? `<button type="button" class="mini-chip-btn" data-edit-block="${idx}">编辑</button>` : ''}
                  <button type="button" class="mini-chip-btn" data-copy-code="${idx}">复制</button>
                </div>
                <pre class="blk-code-pre"><code>${highlightCode(blk.code, blk.lang)}</code></pre>
              </div>
            </div>
          `;
        }

        if (blk.type === 'h1' || blk.type === 'h2' || blk.type === 'h3' || blk.type === 'h4') {
          const anchorId = `heading-${idx}`;
          return `
            <div class="block-item ${editable ? 'is-editable' : ''}" id="${anchorId}" data-block-idx="${idx}">
              ${editBtnHtml}
              <div class="blk-${blk.type} ${cCls}" ${dblAttr}>${renderInlineMarkdown(blk.text, refs, mediaMap)}</div>
            </div>
          `;
        }

        if (blk.type === 'equation') {
          return `
            <div class="block-item ${editable ? 'is-editable' : ''}" data-block-idx="${idx}">
              ${editBtnHtml}
              <div class="blk-equation ${cCls}" ${dblAttr}>${renderLatexMath(blk.text, true)}</div>
            </div>
          `;
        }

        if (blk.type === 'toc') {
          if (allHeadings.length === 0) return '';
          return `
            <div class="block-item blk-toc" data-block-idx="${idx}">
              <div style="font-size:11.5px;color:var(--text-muted);margin-bottom:2px;">目录</div>
              ${allHeadings
                .map(
                  (h) =>
                    `<button type="button" class="blk-toc-link" style="padding-left:${(h.level - 1) * 14}px;" data-scroll-to="${h.anchorId}">${escapeHtml(h.text)}</button>`
                )
                .join('')}
            </div>
          `;
        }

        if (blk.type === 'todo') {
          return `
            <div class="block-item ${editable ? 'is-editable' : ''}" data-block-idx="${idx}">
              ${editBtnHtml}
              <div class="blk-todo ${blk.checked ? 'is-checked' : ''} ${cCls}">
                <input type="checkbox" ${blk.checked ? 'checked' : ''} ${editable ? `data-toggle-todo="${idx}"` : 'disabled'} />
                <div class="blk-todo-text" ${dblAttr}>${renderInlineMarkdown(blk.text, refs, mediaMap)}</div>
              </div>
            </div>
          `;
        }

        if (blk.type === 'bullet' || blk.type === 'numbered') {
          const pad = Math.min(4, blk.indent || 0) * 20;
          const marker = blk.type === 'numbered' ? `${blk.num}.` : '•';
          return `
            <div class="block-item ${editable ? 'is-editable' : ''}" data-block-idx="${idx}" style="padding-left:${pad}px;">
              ${editBtnHtml}
              <div class="blk-list-item ${cCls}">
                <span class="blk-list-marker">${escapeHtml(marker)}</span>
                <div style="flex:1;word-break:break-word;" ${dblAttr}>${renderInlineMarkdown(blk.text, refs, mediaMap)}</div>
              </div>
            </div>
          `;
        }

        if (blk.type === 'quote') {
          return `
            <div class="block-item ${editable ? 'is-editable' : ''}" data-block-idx="${idx}">
              ${editBtnHtml}
              <blockquote class="blk-quote ${cCls}" ${dblAttr}>${renderInlineMarkdown(blk.text, refs, mediaMap)}</blockquote>
            </div>
          `;
        }

        if (blk.type === 'callout') {
          const innerBlocks = parseNotionMarkdownBlocks(blk.text);
          const innerHtml =
            innerBlocks.length > 1 || (innerBlocks[0] && innerBlocks[0].type !== 'paragraph')
              ? renderBlocksHtml(innerBlocks, refs, mediaMap, { editable: false })
              : renderInlineMarkdown(blk.text, refs, mediaMap);
          return `
            <div class="block-item ${editable ? 'is-editable' : ''}" data-block-idx="${idx}">
              ${editBtnHtml}
              <div class="blk-callout ${cCls}" ${dblAttr}>
                <span class="blk-callout-icon">${escapeHtml(blk.icon || '💡')}</span>
                <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;">${innerHtml}</div>
              </div>
            </div>
          `;
        }

        if (blk.type === 'toggle') {
          const hCls = blk.heading ? `blk-${blk.heading}` : '';
          const childBlocks = blk.body ? parseNotionMarkdownBlocks(blk.body) : [];
          const childHtml = childBlocks.length
            ? renderBlocksHtml(childBlocks, refs, mediaMap, { editable: false })
            : '';
          return `
            <div class="block-item" data-block-idx="${idx}">
              <details class="blk-details ${cCls}">
                <summary class="${hCls}" style="margin:0;">${renderInlineMarkdown(blk.summary, refs, mediaMap)}</summary>
                ${childHtml ? `<div class="blk-details-body" style="display:flex;flex-direction:column;gap:8px;">${childHtml}</div>` : ''}
              </details>
            </div>
          `;
        }

        if (blk.type === 'columns') {
          return `
            <div class="block-item blk-columns" data-block-idx="${idx}">
              ${(blk.columns || [])
                .map((col) => {
                  const colBlocks = parseNotionMarkdownBlocks(col.markdown);
                  const style = col.ratio > 0 ? `flex: 0 0 ${col.ratio}%;` : '';
                  return `<div class="blk-column" style="${style}">${renderBlocksHtml(colBlocks, refs, mediaMap, { editable: false })}</div>`;
                })
                .join('')}
            </div>
          `;
        }

        if (blk.type === 'synced_block') {
          const innerBlocks = parseNotionMarkdownBlocks(blk.markdown);
          return `
            <div class="block-item blk-synced" data-block-idx="${idx}">
              ${renderBlocksHtml(innerBlocks, refs, mediaMap, { editable: false })}
            </div>
          `;
        }

        if (blk.type === 'table') {
          const rows = blk.rows || [];
          if (!rows.length) return '';
          const firstIsHeader = rows[0].every((c) => c.isHeader);
          const head = firstIsHeader ? rows[0] : null;
          const bodyRows = firstIsHeader ? rows.slice(1) : rows;
          return `
            <div class="block-item blk-table-wrap" data-block-idx="${idx}">
              <table class="blk-table">
                ${
                  head
                    ? `<thead><tr>${head
                        .map((c) => `<th class="${colorClass(c.color)}">${renderInlineMarkdown(c.text, refs, mediaMap)}</th>`)
                        .join('')}</tr></thead>`
                    : ''
                }
                <tbody>
                  ${bodyRows
                    .map(
                      (r) =>
                        `<tr>${r
                          .map((c) => {
                            const tag = c.isHeader ? 'th' : 'td';
                            return `<${tag} class="${colorClass(c.color)}">${renderInlineMarkdown(c.text, refs, mediaMap)}</${tag}>`;
                          })
                          .join('')}</tr>`
                    )
                    .join('')}
                </tbody>
              </table>
            </div>
          `;
        }

        if (blk.type === 'child_page' || blk.type === 'child_database' || blk.type === 'child_folder') {
          const badge = blk.type === 'child_database' ? '数据库' : blk.type === 'child_folder' ? '文件夹' : '';
          const cleanChildIcon = unwrapIconStr(blk.icon);
          const iconHtml =
            cleanChildIcon && !cleanChildIcon.startsWith('icons/')
              ? `<span class="blk-child-icon">${renderIconBadge(cleanChildIcon, '')}</span>`
              : `<span class="blk-child-icon" style="color:var(--text-muted);">${blk.type === 'child_database' ? DB_SVG : DOC_SVG}</span>`;
          return `
            <div class="block-item" data-block-idx="${idx}">
              <button type="button" class="blk-child-link ${cCls}" data-open-id="${escapeHtml(blk.url)}">
                ${iconHtml}
                <span class="blk-child-title">${escapeHtml(blk.title)}</span>
                ${badge ? `<span class="blk-child-badge">${badge}</span>` : ''}
              </button>
            </div>
          `;
        }

        if (blk.type === 'image') {
          const realSrc = resolveMediaUrl(blk.src, mediaMap, refs);
          if (!realSrc) {
            return `<div class="block-item blk-p" style="color:var(--text-muted);font-size:13px;">🖼️ 图片附件（等待 Notion 签名链接）：${escapeHtml(blk.alt || blk.src)}</div>`;
          }
          return `
            <div class="block-item" data-block-idx="${idx}">
              <figure class="blk-img-figure">
                <img class="blk-img" src="${escapeHtml(realSrc)}" alt="${escapeHtml(blk.alt || '图片')}" data-zoom-img="${escapeHtml(realSrc)}" loading="lazy" />
                ${blk.alt ? `<figcaption class="blk-img-caption">${renderInlineMarkdown(blk.alt, refs, mediaMap)}</figcaption>` : ''}
              </figure>
            </div>
          `;
        }

        if (blk.type === 'media') {
          const realSrc = resolveMediaUrl(blk.src, mediaMap, refs) || blk.src;
          const icons = { pdf: '📕', file: '📎', audio: '🎵', video: '🎬', bookmark: '🔖', embed: '🧩' };
          const labels = { pdf: 'PDF 文档', file: '附件文件', audio: '音频', video: '视频', bookmark: '网页书签', embed: '嵌入内容' };
          const displayTitle = blk.alt || blk.src || labels[blk.mediaType] || '附件';
          return `
            <div class="block-item" data-block-idx="${idx}">
              <button type="button" class="blk-media-card" data-external-url="${escapeHtml(refs[blk.src] || realSrc || '')}">
                <span>${icons[blk.mediaType] || '📎'}</span>
                <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(displayTitle)}</span>
                <span style="font-size:11.5px;color:var(--text-muted);">${labels[blk.mediaType] || '打开'}</span>
              </button>
            </div>
          `;
        }

        if (blk.type === 'hr') {
          return `<hr class="blk-hr" />`;
        }

        return `
          <div class="block-item ${editable ? 'is-editable' : ''}" data-block-idx="${idx}">
            ${editBtnHtml}
            <div class="blk-p ${cCls}" ${dblAttr}>${renderInlineMarkdown(blk.text, refs, mediaMap)}</div>
          </div>
        `;
      })
      .join('');
  }

  function renderPageView() {
    const p = state.currentPage;
    if (!p) return;

    const blocks = parseNotionMarkdownBlocks(p.markdown);
    const refs = p.references || {};
    const mediaMap = p.proxiedReferences || {};
    const allHeadings = blocks
      .map((b, i) => ({ b, i }))
      .filter(({ b }) => b.type === 'h1' || b.type === 'h2' || b.type === 'h3')
      .map(({ b, i }) => ({
        level: Number(b.type[1]),
        text: unescapeMarkdownText(b.text.replace(/<[^>]+>/g, '')),
        anchorId: `heading-${i}`,
      }));

    let bodyHtml = '';
    if (state.rawMode) {
      bodyHtml = `
        <div class="raw-editor-wrap">
          <textarea class="raw-editor-textarea" id="rawMarkdownEditor">${escapeHtml(p.markdown || '')}</textarea>
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span style="font-size:12px;color:var(--text-muted);">提示：请保留原有 &lt;page&gt; / &lt;database&gt; 子页面标签以免误删。</span>
            <div style="display:flex;gap:8px;">
              <button type="button" class="ghost-btn" id="btnCancelRaw">取消</button>
              <button type="button" class="solid-btn" id="btnSaveRaw">保存并同步到 Notion</button>
            </div>
          </div>
        </div>
      `;
    } else {
      const blocksHtml = renderBlocksHtml(blocks, refs, mediaMap, { editable: true, allHeadings });

      let dbRowsHtml = '';
      if (Array.isArray(p.databaseRows) && p.databaseRows.length > 0) {
        dbRowsHtml = `
          <div style="margin-top:20px;">
            <div style="font-size:12.5px;color:var(--text-muted);margin-bottom:8px;">数据库条目（${p.databaseRows.length}）</div>
            ${p.databaseRows
              .map(
                (r) => `
              <button type="button" class="blk-child-link" data-open-id="${escapeHtml(r.id || r.url)}">
                <span>${renderIconBadge(r.icon, DOC_SVG)}</span>
                <span class="blk-child-title">${escapeHtml(r.title)}</span>
              </button>`
              )
              .join('')}
          </div>
        `;
      }

      bodyHtml = `
        <div class="doc-blocks" id="docBlocks">
          ${blocksHtml || ''}
        </div>
        ${dbRowsHtml}
        <div class="slash-composer" id="slashComposer">
          <input type="text" class="slash-input" id="slashInput" placeholder="按 / 插入区块" autocomplete="off" />
          <div class="slash-menu" id="slashMenu"></div>
        </div>
      `;
    }

    const coverUrl = p.cover ? resolveMediaUrl(p.cover, mediaMap, refs) || p.cover : '';
    const coverHtml =
      coverUrl && (/^https?:\/\//i.test(coverUrl) || coverUrl.startsWith('/api/media'))
        ? `<img class="page-cover" src="${escapeHtml(coverUrl)}" alt="" />`
        : '';

    const cleanIcon = unwrapIconStr(p.icon);
    const hasDisplayIcon = Boolean(cleanIcon && !cleanIcon.startsWith('icons/') && !cleanIcon.startsWith(':'));
    const heroIconInner = hasDisplayIcon
      ? /^https?:\/\//i.test(cleanIcon) || cleanIcon.startsWith('/api/media')
        ? `<img src="${escapeHtml(cleanIcon)}" alt="" />`
        : `<span>${escapeHtml(cleanIcon)}</span>`
      : '';

    mainScroll.innerHTML = `
      ${coverHtml}
      <article class="doc-container ${p.fullWidth ? 'is-full-width' : ''}">
        <div class="doc-header-zone">
          ${hasDisplayIcon ? `<div class="doc-hero-icon" id="docIconBtn" title="点击更换图标">${heroIconInner}</div>` : ''}
          <div class="doc-quick-bar">
            <button type="button" class="doc-quick-btn" id="btnPickIcon">☺ ${cleanIcon ? '更换图标' : '添加图标'}</button>
            <button type="button" class="doc-quick-btn" id="btnNewChildPage">＋ 新建子页面</button>
            <button type="button" class="doc-quick-btn" id="btnQuickRaw">✎ ${state.rawMode ? '退出源码' : 'Markdown 源码'}</button>
            <button type="button" class="doc-quick-btn" id="btnPageRefreshInline">↻ 同步</button>
          </div>

          <div class="doc-title-row">
            <div class="doc-title-input" id="docTitleEditable" contenteditable="true" spellcheck="false">${escapeHtml(p.title)}</div>
          </div>
        </div>

        ${bodyHtml}
      </article>
    `;

    bindPageEvents(blocks);
  }

  function bindPageEvents(blocks) {
    const p = state.currentPage;
    if (!p) return;

    document.getElementById('btnPageRefreshInline')?.addEventListener('click', () => {
      void openPage(p.id, { pushHistory: false, silent: false });
    });

    // 标题行内编辑保存
    const titleEl = document.getElementById('docTitleEditable');
    let origTitle = p.title;
    titleEl?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        titleEl.blur();
      }
    });
    titleEl?.addEventListener('blur', async () => {
      const next = (titleEl.textContent || '').trim();
      if (!next || next === origTitle) {
        titleEl.textContent = origTitle;
        return;
      }
      origTitle = next;
      p.title = next;
      setSyncIndicator('正在保存标题...');
      try {
        await apiJson('/api/page/update', {
          method: 'POST',
          body: JSON.stringify({ pageId: p.id, action: 'update_title', title: next }),
        });
        setSyncIndicator('已保存', 1800);
        renderTopbar();
        notifyHostContext();
      } catch (err) {
        setSyncIndicator('');
        showToast(`保存标题失败：${err.message}`);
      }
    });

    // 图标与子页面快捷操作
    const openIconModal = () => {
      const emojis = ['📝', '📘', '🚀', '💡', '✅', '🧠', '🔬', '📊', '⚡', '🎯', '📌', '🗂️'];
      openModal(`
        <h3 class="modal-title">设置页面图标</h3>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;">
          ${emojis.map((em) => `<button type="button" class="ghost-btn" style="font-size:18px;width:42px;padding:0;" data-pick-emoji="${em}">${em}</button>`).join('')}
        </div>
        <label class="field-label">或输入任意 Emoji（留空则移除图标）</label>
        <input class="field-input" id="customEmojiInput" value="${escapeHtml(p.icon || '')}" placeholder="例如 🚀" />
        <div class="modal-actions">
          <button type="button" class="ghost-btn" id="modalCancel">取消</button>
          <button type="button" class="solid-btn" id="modalConfirmIcon">保存图标</button>
        </div>
      `);
      modalBox.querySelectorAll('[data-pick-emoji]').forEach((b) => {
        b.addEventListener('click', () => {
          document.getElementById('customEmojiInput').value = b.getAttribute('data-pick-emoji');
        });
      });
      document.getElementById('modalCancel')?.addEventListener('click', closeModal);
      document.getElementById('modalConfirmIcon')?.addEventListener('click', async () => {
        const val = document.getElementById('customEmojiInput').value.trim() || 'none';
        closeModal();
        setSyncIndicator('正在更新图标...');
        try {
          await apiJson('/api/page/update', {
            method: 'POST',
            body: JSON.stringify({ pageId: p.id, action: 'update_icon', icon: val }),
          });
          p.icon = val === 'none' ? null : val;
          setSyncIndicator('已保存', 1500);
          renderAll();
        } catch (err) {
          setSyncIndicator('');
          showToast(err.message);
        }
      });
    };
    document.getElementById('btnPickIcon')?.addEventListener('click', openIconModal);
    document.getElementById('docIconBtn')?.addEventListener('click', openIconModal);
    document.getElementById('btnNewChildPage')?.addEventListener('click', () => openCreatePageModal(p.id));
    document.getElementById('btnQuickRaw')?.addEventListener('click', () => {
      state.rawMode = !state.rawMode;
      state.editingBlockIdx = -1;
      renderAll();
    });

    // 源码模式保存
    document.getElementById('btnCancelRaw')?.addEventListener('click', () => {
      state.rawMode = false;
      renderAll();
    });
    document.getElementById('btnSaveRaw')?.addEventListener('click', async () => {
      const nextMd = document.getElementById('rawMarkdownEditor')?.value ?? '';
      setSyncIndicator('正在同步正文...');
      try {
        await apiJson('/api/page/update', {
          method: 'POST',
          body: JSON.stringify({ pageId: p.id, action: 'replace_content', newStr: nextMd }),
        });
        p.markdown = nextMd;
        state.rawMode = false;
        setSyncIndicator('已同步到 Notion', 2000);
        renderAll();
      } catch (err) {
        setSyncIndicator('');
        showToast(`同步失败：${err.message}`);
      }
    });

    // 复制代码块
    mainScroll.querySelectorAll('[data-copy-code]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const idx = Number(btn.getAttribute('data-copy-code'));
        const blk = blocks[idx];
        if (!blk) return;
        try {
          await navigator.clipboard.writeText(blk.code);
          showToast('已复制代码');
        } catch {
          showToast('复制失败');
        }
      });
    });

    // 勾选 / 取消待办事项即时同步（同时兼容 - [ ] 与 <todo checked="...">）
    mainScroll.querySelectorAll('[data-toggle-todo]').forEach((cb) => {
      cb.addEventListener('change', async () => {
        const idx = Number(cb.getAttribute('data-toggle-todo'));
        const blk = blocks[idx];
        if (!blk) return;
        const checked = cb.checked;
        const oldRaw = blk.raw;
        const newRaw = blk.xmlTodo
          ? oldRaw.replace(/checked="(?:true|false)"/i, `checked="${checked ? 'true' : 'false'}"`)
          : `${blk.prefix}[${checked ? 'x' : ' '}] ${blk.text}`;
        cb.closest('.blk-todo')?.classList.toggle('is-checked', checked);
        setSyncIndicator('正在同步待办...');
        try {
          await apiJson('/api/page/update', {
            method: 'POST',
            body: JSON.stringify({ pageId: p.id, action: 'update_content', oldStr: oldRaw, newStr: newRaw }),
          });
          p.markdown = replaceOnce(p.markdown, oldRaw, newRaw);
          setSyncIndicator('已保存', 1500);
          renderPageView();
        } catch (err) {
          cb.checked = !checked;
          cb.closest('.blk-todo')?.classList.toggle('is-checked', !checked);
          setSyncIndicator('');
          showToast(`更新待办失败：${err.message}`);
        }
      });
    });

    // 图片点击放大灯箱 & 目录跳转
    const lightbox = document.getElementById('lightboxBackdrop');
    const lightboxImg = document.getElementById('lightboxImg');
    mainScroll.querySelectorAll('[data-zoom-img]').forEach((img) => {
      img.addEventListener('click', () => {
        if (!lightbox || !lightboxImg) return;
        lightboxImg.src = img.getAttribute('data-zoom-img') || img.src;
        lightbox.classList.add('is-open');
      });
    });
    mainScroll.querySelectorAll('[data-scroll-to]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const targetId = btn.getAttribute('data-scroll-to');
        if (targetId) document.getElementById(targetId)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });

    // 点击编辑 / 双击块编辑
    const enterEdit = (idx) => {
      state.editingBlockIdx = idx;
      renderPageView();
      const ed = document.getElementById('activeBlockEditor');
      if (ed) {
        ed.focus();
        ed.setSelectionRange(ed.value.length, ed.value.length);
      }
    };
    mainScroll.querySelectorAll('[data-edit-block]').forEach((btn) => {
      btn.addEventListener('click', () => enterEdit(Number(btn.getAttribute('data-edit-block'))));
    });
    mainScroll.querySelectorAll('[data-dblclick-edit]').forEach((el) => {
      el.addEventListener('dblclick', () => enterEdit(Number(el.getAttribute('data-dblclick-edit'))));
    });

    // 行内块编辑器保存/取消
    const activeEd = document.getElementById('activeBlockEditor');
    const saveActiveBlock = async () => {
      const idx = state.editingBlockIdx;
      const blk = blocks[idx];
      if (!blk || !activeEd) return;
      const nextRaw = activeEd.value;
      if (nextRaw === blk.raw) {
        state.editingBlockIdx = -1;
        renderPageView();
        return;
      }
      setSyncIndicator('正在保存修改...');
      try {
        await apiJson('/api/page/update', {
          method: 'POST',
          body: JSON.stringify({ pageId: p.id, action: 'update_content', oldStr: blk.raw, newStr: nextRaw }),
        });
        p.markdown = replaceOnce(p.markdown, blk.raw, nextRaw);
        state.editingBlockIdx = -1;
        setSyncIndicator('已保存', 1600);
        renderPageView();
      } catch (err) {
        setSyncIndicator('');
        showToast(`保存失败：${err.message}`);
      }
    };
    document.getElementById('btnCancelBlockEdit')?.addEventListener('click', () => {
      state.editingBlockIdx = -1;
      renderPageView();
    });
    document.getElementById('btnSaveBlockEdit')?.addEventListener('click', () => void saveActiveBlock());
    activeEd?.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        e.preventDefault();
        state.editingBlockIdx = -1;
        renderPageView();
      } else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        void saveActiveBlock();
      } else if (e.key === 'Tab') {
        e.preventDefault();
        const s = activeEd.selectionStart;
        const end = activeEd.selectionEnd;
        activeEd.value = activeEd.value.slice(0, s) + '    ' + activeEd.value.slice(end);
        activeEd.selectionStart = activeEd.selectionEnd = s + 4;
      }
    });

    // 子页面与行内链接跳转
    mainScroll.querySelectorAll('[data-open-id]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-open-id');
        if (id) void openPage(id);
      });
    });
    mainScroll.querySelectorAll('[data-notion-url]').forEach((a) => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        const u = a.getAttribute('data-notion-url');
        if (u) void openPage(u);
      });
    });
    mainScroll.querySelectorAll('[data-external-url]').forEach((a) => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        const u = a.getAttribute('data-external-url');
        if (u) openExternalUrl(u);
      });
    });

    // 底部「按 / 插入区块」斜杠菜单绑定
    bindSlashComposer(p);
  }

  function replaceOnce(src, oldStr, newStr) {
    const idx = String(src || '').indexOf(oldStr);
    if (idx === -1) return src;
    return src.slice(0, idx) + newStr + src.slice(idx + oldStr.length);
  }

  function bindSlashComposer(page) {
    const input = document.getElementById('slashInput');
    const menu = document.getElementById('slashMenu');
    if (!input || !menu) return;

    const getFiltered = () => {
      const q = state.slashFilter.toLowerCase();
      if (!q) return SLASH_COMMANDS;
      return SLASH_COMMANDS.filter(
        (c) => c.id.includes(q) || c.name.toLowerCase().includes(q) || c.desc.toLowerCase().includes(q)
      );
    };

    const renderMenu = () => {
      if (!state.slashOpen) {
        menu.classList.remove('is-open');
        return;
      }
      const list = getFiltered();
      if (state.slashSelectedIdx >= list.length) state.slashSelectedIdx = 0;
      menu.innerHTML = `
        <div class="slash-menu-title">插入区块</div>
        ${
          list.length === 0
            ? `<div style="padding:10px;font-size:12px;color:var(--text-muted);text-align:center;">无匹配区块</div>`
            : list
                .map(
                  (cmd, idx) => `
              <button type="button" class="slash-item ${idx === state.slashSelectedIdx ? 'is-selected' : ''}" data-slash-id="${cmd.id}">
                <span class="slash-item-icon">${escapeHtml(cmd.icon)}</span>
                <div>
                  <div class="slash-item-name">${escapeHtml(cmd.name)}</div>
                  <div class="slash-item-desc">${escapeHtml(cmd.desc)}</div>
                </div>
              </button>`
                )
                .join('')
        }
      `;
      menu.classList.add('is-open');
      menu.querySelectorAll('[data-slash-id]').forEach((btn) => {
        btn.addEventListener('mousedown', (e) => {
          e.preventDefault();
          const cmd = SLASH_COMMANDS.find((c) => c.id === btn.getAttribute('data-slash-id'));
          if (cmd) applySlashCommand(cmd, page, input);
        });
      });
    };

    input.addEventListener('input', () => {
      const val = input.value;
      if (val.startsWith('/')) {
        state.slashOpen = true;
        state.slashFilter = val.slice(1).trim();
        state.slashSelectedIdx = 0;
        renderMenu();
      } else {
        state.slashOpen = false;
        menu.classList.remove('is-open');
      }
    });

    input.addEventListener('keydown', async (e) => {
      if (state.slashOpen) {
        const list = getFiltered();
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          state.slashSelectedIdx = list.length ? (state.slashSelectedIdx + 1) % list.length : 0;
          renderMenu();
          return;
        }
        if (e.key === 'ArrowUp') {
          e.preventDefault();
          state.slashSelectedIdx = list.length ? (state.slashSelectedIdx - 1 + list.length) % list.length : 0;
          renderMenu();
          return;
        }
        if (e.key === 'Escape') {
          e.preventDefault();
          state.slashOpen = false;
          renderMenu();
          return;
        }
        if (e.key === 'Enter' && !e.isComposing && list[state.slashSelectedIdx]) {
          e.preventDefault();
          applySlashCommand(list[state.slashSelectedIdx], page, input);
          return;
        }
      }

      if (e.key === 'Enter' && !e.isComposing) {
        const text = input.value.trim();
        if (!text) return;
        e.preventDefault();
        input.value = '';
        await appendMarkdownToCurrentPage(text);
      }
    });

    input.addEventListener('blur', () => {
      setTimeout(() => {
        state.slashOpen = false;
        menu.classList.remove('is-open');
      }, 150);
    });
  }

  function applySlashCommand(cmd, page, input) {
    state.slashOpen = false;
    document.getElementById('slashMenu')?.classList.remove('is-open');
    input.value = '';

    if (cmd.instant) {
      void appendMarkdownToCurrentPage(cmd.instant);
      return;
    }
    if (cmd.modal === 'subpage') {
      openCreatePageModal(page.id);
      return;
    }
    if (cmd.modal === 'code') {
      openModal(`
        <h3 class="modal-title">插入代码块</h3>
        <label class="field-label">编程语言（可选，如 python / js / bash）</label>
        <input class="field-input" id="codeLangInput" value="python" placeholder="python" />
        <label class="field-label">代码内容</label>
        <textarea class="field-textarea" id="codeBodyInput" rows="7" style="font-family:Consolas,monospace;font-size:13px;" placeholder="输入代码..."></textarea>
        <div class="modal-actions">
          <button type="button" class="ghost-btn" id="modalCancel">取消</button>
          <button type="button" class="solid-btn" id="modalInsertCode">插入并同步</button>
        </div>
      `);
      document.getElementById('modalCancel')?.addEventListener('click', closeModal);
      document.getElementById('modalInsertCode')?.addEventListener('click', async () => {
        const lang = (document.getElementById('codeLangInput').value || '').trim();
        const body = document.getElementById('codeBodyInput').value || '';
        if (!body.trim()) return;
        closeModal();
        await appendMarkdownToCurrentPage(`\`\`\`${lang}\n${body}\n\`\`\``);
      });
      document.getElementById('codeBodyInput')?.focus();
      return;
    }
    if (cmd.modal === 'callout') {
      openModal(`
        <h3 class="modal-title">插入标注框 (Callout)</h3>
        <label class="field-label">图标 Emoji</label>
        <input class="field-input" id="calloutIconInput" value="💡" />
        <label class="field-label">标注内容</label>
        <textarea class="field-textarea" id="calloutBodyInput" rows="4" placeholder="输入重点提示..."></textarea>
        <div class="modal-actions">
          <button type="button" class="ghost-btn" id="modalCancel">取消</button>
          <button type="button" class="solid-btn" id="modalInsertCallout">插入并同步</button>
        </div>
      `);
      document.getElementById('modalCancel')?.addEventListener('click', closeModal);
      document.getElementById('modalInsertCallout')?.addEventListener('click', async () => {
        const icon = (document.getElementById('calloutIconInput').value || '💡').trim();
        const body = (document.getElementById('calloutBodyInput').value || '').trim();
        if (!body) return;
        closeModal();
        await appendMarkdownToCurrentPage(`<callout icon="${icon}">\n${body}\n</callout>`);
      });
      document.getElementById('calloutBodyInput')?.focus();
      return;
    }

    input.value = cmd.prefix || '';
    input.focus();
  }

  async function appendMarkdownToCurrentPage(mdSnippet) {
    const p = state.currentPage;
    if (!p) return;
    setSyncIndicator('正在插入区块...');
    try {
      await apiJson('/api/page/update', {
        method: 'POST',
        body: JSON.stringify({
          pageId: p.id,
          action: 'insert_block',
          position: 'end',
          content: mdSnippet,
        }),
      });
      p.markdown = p.markdown ? `${p.markdown.replace(/\s+$/, '')}\n\n${mdSnippet}` : mdSnippet;
      setSyncIndicator('已同步', 1600);
      renderPageView();
      document.getElementById('slashInput')?.focus();
    } catch (err) {
      setSyncIndicator('');
      showToast(`插入失败：${err.message}`);
    }
  }

  // --- 弹窗管理 ---
  function openModal(html) {
    modalBox.innerHTML = html;
    modalBackdrop.classList.add('is-open');
  }
  function closeModal() {
    modalBackdrop.classList.remove('is-open');
    modalBox.innerHTML = '';
  }
  modalBackdrop.addEventListener('click', (e) => {
    if (e.target === modalBackdrop) closeModal();
  });
  document.getElementById('lightboxBackdrop')?.addEventListener('click', () => {
    document.getElementById('lightboxBackdrop')?.classList.remove('is-open');
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      document.getElementById('lightboxBackdrop')?.classList.remove('is-open');
    }
  });

  function openCreatePageModal(parentPageId = '') {
    const isChild = Boolean(parentPageId);
    openModal(`
      <h3 class="modal-title">${isChild ? '新建子页面' : '新建 Notion 页面'}</h3>
      <label class="field-label">页面标题</label>
      <input class="field-input" id="newPageTitleInput" placeholder="输入笔记标题..." />
      <label class="field-label">初始内容（可选，支持 Markdown）</label>
      <textarea class="field-textarea" id="newPageContentInput" rows="4" placeholder="留空则创建空白笔记..."></textarea>
      <div class="modal-actions">
        <button type="button" class="ghost-btn" id="modalCancel">取消</button>
        <button type="button" class="solid-btn" id="modalConfirmCreate">创建并打开</button>
      </div>
    `);
    const titleInput = document.getElementById('newPageTitleInput');
    const contentInput = document.getElementById('newPageContentInput');
    const confirmBtn = document.getElementById('modalConfirmCreate');

    const submitCreate = async () => {
      const title = titleInput.value.trim() || '无标题笔记';
      const content = contentInput.value;
      confirmBtn.disabled = true;
      confirmBtn.textContent = '创建中...';
      try {
        const res = await apiJson('/api/page/create', {
          method: 'POST',
          body: JSON.stringify({ title, content, parentPageId }),
        });
        closeModal();
        showToast(`已创建「${title}」`);
        if (res.page && (res.page.id || res.page.url)) {
          await openPage(res.page.id || res.page.url);
        } else {
          await loadHome(true);
        }
      } catch (err) {
        confirmBtn.disabled = false;
        confirmBtn.textContent = '创建并打开';
        showToast(`创建失败：${err.message}`);
      }
    };

    document.getElementById('modalCancel')?.addEventListener('click', closeModal);
    confirmBtn?.addEventListener('click', () => void submitCreate());
    titleInput?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.isComposing) {
        e.preventDefault();
        void submitCreate();
      }
    });
    titleInput?.focus();
  }

  let syncClearTimer = null;
  function setSyncIndicator(text, autoClearMs = 0) {
    state.syncText = text;
    clearTimeout(syncClearTimer);
    const pill = document.getElementById('syncPill');
    if (pill) {
      pill.textContent = text;
      pill.classList.toggle('is-visible', Boolean(text));
    }
    if (autoClearMs > 0) {
      syncClearTimer = setTimeout(() => setSyncIndicator(''), autoClearMs);
    }
  }

  // --- 数据加载与动作 ---
  async function triggerOAuthLogin() {
    const btn = document.getElementById('btnStartOAuth');
    const statusEl = document.getElementById('authStatus');
    const fallbackBtn = document.getElementById('btnOpenAuthFallback');
    if (btn) btn.disabled = true;
    if (statusEl) statusEl.textContent = '正在准备 Notion 官方 OAuth 授权链接...';
    try {
      const res = await fetch('/api/auth/start', { method: 'POST' });
      const data = await res.json();
      if (!res.ok || !data.ok || !data.authUrl) {
        throw new Error(data.error || '无法生成授权链接');
      }
      state.lastAuthUrl = data.authUrl;
      openExternalUrl(data.authUrl);
      if (statusEl) statusEl.textContent = '已在浏览器打开 Notion 授权页，请在浏览器点击允许访问...';
      if (fallbackBtn) fallbackBtn.style.display = 'inline-block';
      startAuthPolling();
    } catch (err) {
      if (statusEl) statusEl.textContent = `启动授权失败：${err.message}`;
    } finally {
      if (btn) btn.disabled = false;
    }
  }

  function startAuthPolling() {
    clearInterval(state.authPollTimer);
    let ticks = 0;
    state.authPollTimer = setInterval(async () => {
      ticks++;
      if (ticks > 120) {
        clearInterval(state.authPollTimer);
        return;
      }
      try {
        const res = await fetch('/api/auth/status', { cache: 'no-store' });
        const data = await res.json();
        if (data && data.connected) {
          clearInterval(state.authPollTimer);
          state.connected = true;
          state.workspace = data.workspace;
          state.user = data.user;
          showToast('Notion 授权成功');
          await loadHome(true);
        }
      } catch {}
    }, 1500);
  }

  async function loadHome(forceRefresh = false) {
    if (state.view !== 'home') {
      state.view = 'loading';
      renderAll();
    }
    try {
      const data = await apiJson(`/api/home${forceRefresh ? '?refresh=1' : ''}`);
      state.connected = true;
      state.workspace = data.workspace;
      state.user = data.user;
      state.recentPages = data.recentPages || [];
      state.privatePages = data.privatePages || [];
      state.favoritePages = data.favoritePages || [];
      state.currentPage = null;
      state.view = 'home';
      renderAll();
    } catch (err) {
      if (state.view !== 'auth') {
        showToast(err.message);
      }
    }
  }

  async function loadAllPages(tab, cursor = '', append = false) {
    if (!append) {
      state.allResults = [];
      state.allNextCursor = '';
      renderTopbar();
      mainScroll.innerHTML = `<div class="loading-center"><div class="spinner"></div><div>加载页面列表中...</div></div>`;
    }
    try {
      const data = await apiJson(
        `/api/pages/all?tab=${encodeURIComponent(tab)}&limit=36${cursor ? `&cursor=${encodeURIComponent(cursor)}` : ''}`
      );
      state.allResults = append ? [...state.allResults, ...(data.results || [])] : data.results || [];
      state.allNextCursor = data.nextCursor || '';
      state.view = 'all';
      renderAll();
    } catch (err) {
      showToast(err.message);
    }
  }

  async function runHomeSearch(query) {
    const q = String(query || '').trim();
    if (!q) return;
    state.searchLoading = true;
    renderHomeView();
    const inp = document.getElementById('homeSearchInput');
    if (inp) {
      inp.focus();
      inp.setSelectionRange(inp.value.length, inp.value.length);
    }
    try {
      const data = await apiJson(`/api/search?q=${encodeURIComponent(q)}&limit=15`);
      if (state.searchQuery.trim() !== q) return;
      state.searchResults = data.results || [];
    } catch (err) {
      state.searchResults = [];
      showToast(err.message);
    } finally {
      state.searchLoading = false;
      renderHomeView();
      const inp2 = document.getElementById('homeSearchInput');
      if (inp2) {
        inp2.focus();
        inp2.setSelectionRange(inp2.value.length, inp2.value.length);
      }
    }
  }

  async function openPage(idOrUrl, opts = {}) {
    const { pushHistory = true, silent = false } = opts;
    if (pushHistory && state.currentPage?.id && state.currentPage.id !== idOrUrl) {
      state.pageHistory.push(state.currentPage.id);
      if (state.pageHistory.length > 30) state.pageHistory.shift();
    }
    state.rawMode = false;
    state.editingBlockIdx = -1;
    if (!silent) {
      state.view = 'loading';
      renderAll();
    }
    try {
      const data = await apiJson(`/api/page?id=${encodeURIComponent(idOrUrl)}`);
      state.currentPage = data.page;
      state.view = 'page';
      renderAll();
      mainScroll.scrollTop = 0;
    } catch (err) {
      if (state.view !== 'auth') {
        showToast(`打开页面失败：${err.message}`);
        state.view = state.currentPage ? 'page' : 'home';
        renderAll();
      }
    }
  }

  function renderAll() {
    renderTopbar();
    renderMain();
    notifyHostContext();
  }

  // --- 全局点击关闭弹出层 + 划选正文同步给宿主悬浮提问框 ---
  document.addEventListener('pointerdown', (e) => {
    if (state.accountMenuOpen && !e.target.closest('.popover-wrap')) {
      state.accountMenuOpen = false;
      document.getElementById('accountMenu')?.classList.remove('is-open');
    }
  });

  let selectionTimer = null;
  document.addEventListener('selectionchange', () => {
    clearTimeout(selectionTimer);
    selectionTimer = setTimeout(() => {
      if (state.view !== 'page') {
        postToHost({ type: 'AGY_NOTION_SELECTION_CHANGE', text: '' });
        return;
      }
      const sel = window.getSelection();
      const txt = sel ? String(sel.toString() || '').trim() : '';
      // 忽略输入框/标题编辑器里的选区
      const active = document.activeElement;
      if (active && (active.tagName === 'TEXTAREA' || active.tagName === 'INPUT')) return;
      postToHost({
        type: 'AGY_NOTION_SELECTION_CHANGE',
        text: txt.length >= 2 ? txt.slice(0, 1200) : '',
      });
    }, 180);
  });

  // 监听宿主主题、分栏和刷新指令
  window.addEventListener('message', (event) => {
    const data = event.data;
    if (!data || typeof data !== 'object') return;
    if (data.type === 'AGY_NOTION_HOST_STATE') {
      if (data.theme === 'dark' || data.theme === 'light') {
        document.documentElement.setAttribute('data-theme', data.theme);
      }
      if (data.layout) {
        state.layout = data.layout === 'split' ? 'split' : 'fullscreen';
        renderTopbar();
      }
    } else if (data.type === 'AGY_NOTION_REFRESH_PAGE') {
      if (state.view === 'page' && state.currentPage?.id) {
        void openPage(state.currentPage.id, { pushHistory: false, silent: true }).then(() => {
          showToast('已从 Notion 刷新当前笔记');
        });
      } else if (state.view === 'home') {
        void loadHome(true);
      }
    } else if (data.type === 'AGY_NOTION_OPEN_PAGE' && data.pageId) {
      void openPage(data.pageId);
    }
  });

  // 初始化引导
  async function bootstrap() {
    renderAll();
    try {
      const res = await fetch('/api/auth/status', { cache: 'no-store' });
      const data = await res.json();
      if (data && data.connected) {
        state.connected = true;
        state.workspace = data.workspace;
        state.user = data.user;
        await loadHome(false);
      } else {
        state.connected = false;
        state.view = 'auth';
        renderAll();
      }
    } catch (err) {
      state.view = 'auth';
      renderAll();
      showToast(`服务连接异常：${err?.message || err}`);
    }
  }

  void bootstrap();
})();
</script>
</body>
</html>
