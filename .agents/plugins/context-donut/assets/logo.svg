<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <rect x="12" y="12" width="104" height="104" rx="26" fill="#14171F" stroke="#2D3343" stroke-width="4"/>
  <!-- Background Track Ring -->
  <circle cx="64" cy="64" r="34" stroke="#2A3244" stroke-width="12" fill="none"/>
  <!-- Cached Context Arc (Emerald) -->
  <circle
    cx="64"
    cy="64"
    r="34"
    stroke="#10B981"
    stroke-width="12"
    stroke-linecap="round"
    stroke-dasharray="145 214"
    stroke-dashoffset="0"
    transform="rotate(-90 64 64)"
    fill="none"
  />
  <!-- Fresh Input Arc (Cyan) -->
  <circle
    cx="64"
    cy="64"
    r="34"
    stroke="#38BDF8"
    stroke-width="12"
    stroke-linecap="round"
    stroke-dasharray="32 214"
    stroke-dashoffset="-152"
    transform="rotate(-90 64 64)"
    fill="none"
  />
  <!-- Center Percentage Dot -->
  <circle cx="64" cy="64" r="8" fill="#10B981"/>
</svg>
